[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 800
via_ir = true
bytecode_hash = "none"
# storage layouts in every artifact (script/storage-layout.sh guards append-only upgrades)
extra_output = ["storageLayout"]
additional_compiler_profiles = [
  { name = "v4", via_ir = true, optimizer_runs = 44444444 },
  { name = "house", via_ir = true, optimizer_runs = 1 },
  { name = "posm", via_ir = true, optimizer_runs = 500 },
]
compilation_restrictions = [
  { paths = "lib/v4-core/src/PoolManager.sol", optimizer_runs = 44444444 },
  # v4-periphery's PositionManager with its own settings (tests deploy a local one; the keeper uses the chain's)
  { paths = "lib/v4-periphery/src/PositionManager.sol", optimizer_runs = 500 },
  # keeps FlipperHouse comfortably under EIP-170 (runtime gas difference is negligible on an L2)
  { paths = "src/FlipperHouse.sol", max_optimizer_runs = 1 },
  # the house's cold paths: size over gas
  { paths = "src/house/HouseModule.sol", max_optimizer_runs = 1 },
]
# the vendored Dice Protocol source (a verified copy, kept byte-identical) compiles with its own warnings
ignored_warnings_from = ["src/mocks/dice/"]
# deploy scripts write a machine-readable manifest for dev.sh / the frontend
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read", path = "./out" },
]

[profile.default.fuzz]
runs = 512

[profile.ci.fuzz]
runs = 5000

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"
ink = "${INK_RPC_URL}"
local = "http://127.0.0.1:8545"

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"

[lint]
lint_on_build = false

[profile.default.invariant]
runs = 64
depth = 40
fail_on_revert = false
